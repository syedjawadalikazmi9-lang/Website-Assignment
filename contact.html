<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - My Website</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/x-icon" href="https://via.placeholder.com/32">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-md p-4 flex justify-between items-center">
        <div class="text-xl font-bold text-blue-600">MyBrand</div>
        <div class="space-x-4">
            <a href="index.html" class="text-gray-600 hover:text-blue-600">Home</a>
            <a href="about.html" class="text-gray-600 hover:text-blue-600">About</a>
            <a href="contact.html" class="text-blue-600 font-semibold">Contact</a>
            <a href="signin.html" class="bg-gray-200 px-3 py-1 rounded hover:bg-gray-300">Sign In</a>
            <a href="signup.html" class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">Sign Up</a>
        </div>
    </nav>

    <!-- Contact Form Section -->
    <section class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md my-12">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-900">Contact Us</h1>
        
        <form id="contactForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" id="name" required class="w-full mt-1 p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" required class="w-full mt-1 p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Message</label>
                <textarea id="message" rows="4" required class="w-full mt-1 p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition">Submit</button>
        </form action="https://formspree.io/f/xjykzdnn" method="POST">

        <!-- Response Message Box -->
        <div id="responseMessage" class="hidden mt-4 p-3 bg-green-100 text-green-700 rounded-md text-center font-medium">
            Thank you! Your message has been sent successfully.
        </div>
    </section>

    <!-- JavaScript to Handle Form Response -->
    <script>
        function handleFormSubmit(event) {
            event.preventDefault(); // Page refresh hone se rokay ga
            document.getElementById('contactForm').reset(); // Form fields clear kar dega
            const msgBox = document.getElementById('responseMessage');
            msgBox.classList.remove('hidden'); // Success message show kar dega
        }
    </script>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center py-6 mt-10">
        <p>&copy; 2026 MyBrand. All rights reserved.</p>
    </footer>

</body>
</html>
