<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - My Website</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/x-icon" href="https://via.placeholder.com/32">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-md p-4 flex justify-between items-center">
        <div class="text-xl font-bold text-blue-600">MyBrand</div>
        <div class="space-x-4">
            <a href="index.html" class="text-gray-600 hover:text-blue-600">Home</a>
            <a href="about.html" class="text-gray-600 hover:text-blue-600">About</a>
            <a href="contact.html" class="text-gray-600 hover:text-blue-600">Contact</a>
            <a href="signin.html" class="bg-gray-200 px-3 py-1 rounded hover:bg-gray-300">Sign In</a>
            <a href="signup.html" class="text-blue-600 font-semibold">Sign Up</a>
        </div>
    </nav>

    <!-- Sign Up Form -->
    <section class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md my-12">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-900">Create a New Account</h1>
                <form class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" required class="w-full mt-1 p-2 border border-gray-300 rounded-md">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" required class="w-full mt-1 p-2 border border-gray-300 rounded-md">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" required class="w-full mt-1 p-2 border border-gray-300 rounded-md">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700">Sign Up</button>
        </form>
    </section>
    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center py-6 mt-10">
        <p>&copy; 2026 MyBrand. All rights reserved.</p>
    </footer>

</body>
</html>
